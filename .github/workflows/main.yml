name: Build AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
      - uses: gradle/gradle-build-action@v3
        with:
          cache-disabled: true
      - name: Build AAB
        run: gradle bundleRelease --no-daemon --no-configuration-cache -Djava.awt.headless=true -Dorg.gradle.parallel=false
      - uses: actions/upload-artifact@v4
        with:
          name: SpendLimit-AAB
          path: app/build/outputs/bundle/release/*.aab
