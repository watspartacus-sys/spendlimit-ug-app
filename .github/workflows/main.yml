name: Build AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix gradlew
        run: |
          ls -la
          chmod +x gradlew || echo "gradlew not found, will use gradle"
      - uses: gradle/gradle-build-action@v3
        with:
          cache-disabled: true
          cache-read-only: false
      - name: Build AAB
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --no-daemon --no-configuration-cache --no-parallel -Djava.awt.headless=true
          else
            gradle bundleRelease --no-daemon --no-configuration-cache --no-parallel -Djava.awt.headless=true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SpendLimit-AAB
          path: app/build/outputs/bundle/release/*.aab
